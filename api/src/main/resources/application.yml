spring:
  application:
    name: alef-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alef}
    username: ${SPRING_DATASOURCE_USERNAME:alef}
    password: ${SPRING_DATASOURCE_PASSWORD:alef}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

---
# API profile: serves the REST endpoints and (later) the concierge.
spring:
  config:
    activate:
      on-profile: api

---
# Worker profile: consumes Redis Streams (feature 001+). Web server disabled.
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none
